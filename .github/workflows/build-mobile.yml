name: Build Mobile Apps (iOS & Android)

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build Android App'
        type: boolean
        default: true
      build_ios:
        description: 'Build iOS App'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    name: Build Android (AAB & APK)
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_android }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets & sync Capacitor
        run: npm run cap:build

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Release Bundle (AAB) & APK
        working-directory: android
        run: |
          ./gradlew assembleRelease bundleRelease

      - name: Upload Android Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-builds
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          retention-days: 14

  build-ios:
    name: Build iOS (Xcode Archive)
    runs-on: macos-14
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_ios }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets & sync Capacitor
        run: npm run cap:build

      - name: Build iOS App (Archive)
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcarchive
          path: ios/App/build/App.xcarchive
          retention-days: 14
